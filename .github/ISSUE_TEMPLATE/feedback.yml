name: Feedback
about: Share generalized feedback about the calculator without confidential details
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the calculator. Do not post client names, bank details, tax IDs, invoice images, contracts, personal data, credentials, or confidential business information. Use generalized examples only.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety confirmation
      options:
        - label: This issue contains no client names, personal data, bank details, tax IDs, contracts, invoices, credentials, or confidential business information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Feedback area
      options:
        - Quote calculation
        - Effective hourly margin
        - Payment reminder text
        - Accessibility or usability
        - Documentation
        - Other generalized feedback
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Generalized feedback
      description: Describe the issue or suggestion using test figures or generalized wording only.
      placeholder: "Example: The margin warning is hard to interpret when platform fees are high."
    validations:
      required: true
